<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#2e8561" />
  <meta name="description" content="智能厨房助手 — 家里有什么就吃什么，缺什么自动列清单" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="厨房助手" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
  <title>智能厨房助手</title>
</head>
<body>
  <!-- Login: single-user password (PRD v0.2) -->
  <div id="loginView" class="login">
    <form class="login-card" id="loginForm">
      <h1>智能厨房助手</h1>
      <p>单用户 · 数据仅保存在本机浏览器</p>
      <label for="password">密码</label>
      <input id="password" type="password" autocomplete="current-password" required placeholder="输入密码" />
      <p id="loginError" class="hint hidden" style="color:#b33a3a;margin-top:0"></p>
      <button class="btn" type="submit">进入</button>
      <p class="hint">默认密码：<code>kitchen2026</code>（可在 localStorage 键 <code>smart-kitchen.password</code> 修改）</p>
    </form>
  </div>

  <div id="appView" class="app hidden">
    <div id="installTip" class="install-tip hidden">
      可安装到主屏幕，像 App 一样使用。
      <button type="button" id="installBtn">安装 PWA</button>
    </div>

    <header class="top">
      <h1 id="pageTitle">库存</h1>
      <button type="button" class="icon-btn" id="logoutBtn" title="退出">⎋</button>
    </header>

    <main>
      <section id="page-inv" class="page active">
        <div id="expiryBanner" class="banner hidden"></div>
        <div style="display:flex;gap:0.5rem;margin-bottom:0.75rem">
          <button type="button" class="btn btn-sm" id="addInvBtn">添加</button>
          <button type="button" class="btn btn-sm btn-ghost" id="scanInvBtn">拍照识别</button>
        </div>
        <div id="invList"></div>
      </section>

      <section id="page-recipes" class="page">
        <div style="display:flex;gap:0.5rem;margin-bottom:0.75rem">
          <input id="recipeSearch" placeholder="搜索菜谱" style="flex:1;padding:0.55rem 0.75rem;border:1px solid rgba(20,32,28,0.16);border-radius:8px" />
          <button type="button" class="btn btn-sm" id="importRecipeBtn">导入</button>
        </div>
        <div id="recipeList"></div>
      </section>

      <section id="page-cook" class="page">
        <p class="meta">筛选推荐：点选库存食材与烹饪方式（手机纵向标签 + 列表）。</p>
        <div class="section-title">食材</div>
        <div class="chip-row" id="ingChips"></div>
        <div class="section-title">烹饪方式</div>
        <div class="chip-row" id="methodChips"></div>
        <div class="section-title">结果</div>
        <div id="cookResults"></div>
      </section>

      <section id="page-plan" class="page">
        <div style="display:flex;gap:0.5rem;flex-wrap:wrap;margin-bottom:0.75rem">
          <button type="button" class="btn btn-sm" id="genShopBtn">从计划生成清单</button>
          <button type="button" class="btn btn-sm btn-ghost" id="restockBtn">勾选项入库</button>
        </div>
        <div class="section-title">周计划</div>
        <div id="planList"></div>
        <div class="section-title">购物清单（需求 − 库存）</div>
        <div id="shopList"></div>
      </section>
    </main>

    <nav class="tabbar" aria-label="主导航">
      <button type="button" class="on" data-tab="inv" data-label="库存">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 10h16v10H4zM4 10l2-6h12l2 6"/><path d="M8 14h.01M12 14h.01M16 14h.01"/></svg>
        库存
      </button>
      <button type="button" data-tab="recipes" data-label="菜谱">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19a2 2 0 0 0 2 2h12"/><path d="M6 3h10v18H6z"/><path d="M18 7h2a2 2 0 0 1 2 2v10"/></svg>
        菜谱
      </button>
      <button type="button" data-tab="cook" data-label="推荐">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.5 5.5L19 10l-5.5 1.5L12 17l-1.5-5.5L5 10l5.5-1.5L12 3z"/></svg>
        推荐
      </button>
      <button type="button" data-tab="plan" data-label="计划">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
        计划
      </button>
    </nav>
  </div>

  <div id="sheet" class="sheet hidden">
    <div class="sheet-panel" id="sheetBody"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
